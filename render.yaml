services:
  - type: web
    name: nullclaw
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://YOUR-FREELLM-API-HOST/v1
      - key: LLM_MODEL
        value: auto
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false
      - key: FILESLINK_UPLOAD_URL
        value: https://tcloud-2f7u.onrender.com/api/files/upload
      - key: FILESLINK_API_URL
        value: https://tcloud-2f7u.onrender.com/api/files
      - key: FILESLINK_FILE_DOMAIN
        value: https://tcloud-2f7u.onrender.com/files
      - key: FILESLINK_UPLOAD_TOKEN
        sync: false
      - key: FILESLINK_BACKUP_URL
        sync: false
      - key: FILESLINK_BACKUP_INTERVAL_SECONDS
        value: "900"
      - key: NULLCLAW_BIND
        value: 0.0.0.0
      - key: NULLCLAW_HOME
        value: /nullclaw-data
